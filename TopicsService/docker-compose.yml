services:
  postgres:
    image: postgres:17.9
    container_name: topics-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD (см. .env.example)}
      POSTGRES_DB: topics-api
    ports:
      - "5433:5432"
    volumes:
      - topics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      otus-network:
        aliases:
          - topics-postgres

  topics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: topics-service
    # Порты наружу не публикуются: сервис доступен только внутри otus-network (через Gateway).
    expose:
      - "5294"
    environment:
      - ConnectionStrings__PostgresConnection=Host=topics-postgres;Port=5432;Database=topics-api;Username=postgres;Password=${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD (см. .env.example)}
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?Задайте JWT_SIGNING_KEY (см. .env.example)}
      - Logging__Seq__ApiKey=${SEQ_API_KEY_TOPICS:-}
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - otus-network

volumes:
  topics-postgres-data:

networks:
  otus-network:
    external: true
