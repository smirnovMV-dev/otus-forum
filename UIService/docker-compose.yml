services:
  uiservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uiservice
    ports:
      - "5129:5129"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5129
      - GatewayUrl=http://gateway-service:5000
    networks:
      - otus-network
    volumes:
      - dataprotection-keys:/root/.aspnet/DataProtection-Keys

volumes:
  dataprotection-keys:

networks:
  otus-network:
    external: true
