services:
  postgres:
    image: postgres:17.9
    container_name: auth-users-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD (см. .env.example)}
      POSTGRES_DB: auth-users
    ports:
      - "5533:5432"
    volumes:
      - auth-users-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      otus-network:
        aliases:
          - auth-users-postgres

  auth-users-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-users-service
    # Порты наружу не публикуются: сервис доступен только внутри otus-network (через Gateway).
    expose:
      - "5225"
      - "5226"
    environment:
      - ConnectionStrings__PostgresConnection=Host=auth-users-postgres;Port=5432;Database=auth-users;Username=postgres;Password=${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD (см. .env.example)}
      - Jwt__SigningKey=${JWT_SIGNING_KEY:?Задайте JWT_SIGNING_KEY (см. .env.example)}
      - Logging__Seq__ApiKey=${SEQ_API_KEY_AUTH:-}
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - otus-network

volumes:
  auth-users-postgres-data:

networks:
  otus-network:
    external: true
